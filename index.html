<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151a">
<title>AizaL — Earth Movers</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* instrument panel palette — amber is the colour of a backlit meter, and is
     spent only on the readout and the one primary action per screen */
  --panel:#10151a; --steel:#232b33; --bezel:#05080b;
  --concrete:#e6e9ec; --paper:#ffffff; --line:#ccd2d8;
  --ink:#12171c; --muted:#5b6773;
  --amber:#ffb000; --amber-d:#e09a00;
  --due:#c1352b; --ok:#0e7c52; --warn:#8a6100;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r:5px;
}
@media (prefers-color-scheme: dark){
  :root{--concrete:#161b21; --paper:#1c232a; --line:#2f3942; --ink:#eef2f5; --muted:#8f9ba7;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--concrete); color:var(--ink);
  font:400 16px/1.5 'IBM Plex Sans',system-ui,sans-serif;
  padding-bottom:88px; overscroll-behavior-y:contain;
}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;letter-spacing:.015em;margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* the machine's world (dark) sits above the office's (light); the hazard
   stripe is the seam between them and appears nowhere else */
header{background:var(--panel);color:#fff;padding:var(--s4) var(--s4) var(--s3);position:sticky;top:0;z-index:40}
header .row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
header h1{font-size:25px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
header small{color:#8b97a3;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.hazard{height:5px;background:repeating-linear-gradient(135deg,var(--amber) 0 9px,var(--panel) 9px 18px)}
main{padding:var(--s4) var(--s3) var(--s2);max-width:640px;margin:0 auto}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3)}
.card h2{font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:var(--s2)}
.card.flush{padding:0;overflow:hidden;border:0;background:none}

label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:var(--s3) 0 var(--s1);font-weight:600}
input,select,textarea,button{font-family:inherit;font-size:16px}
input,select,textarea{width:100%;padding:13px var(--s3);border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--steel)}

button{border:0;border-radius:var(--r);padding:15px var(--s4);font-weight:600;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.btn{background:var(--amber);color:var(--panel);width:100%;min-height:54px}
.btn:active{background:var(--amber-d);transform:translateY(1px)}
.btn.xl{min-height:92px;font-size:27px}
.btn.dark{background:var(--panel);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--due);color:#fff}
.btn.sm{padding:9px var(--s3);min-height:0;font-size:15px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}

/* SIGNATURE — the readout, recessed into the panel like the real instrument.
   Used for the meter, and for money, because this business measures both in hours. */
.meter{background:var(--panel);border-radius:var(--r);padding:var(--s3) var(--s2);text-align:center;
  border:1px solid var(--bezel);box-shadow:inset 0 2px 6px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06)}
.meter .lbl{color:#8b97a3;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.meter .val{font-family:'Barlow Condensed';font-weight:600;font-size:40px;color:var(--amber);line-height:1.05;
  font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,176,0,.3)}
.meter .val.small{font-size:27px}
.meter.plain .val{color:#e8edf2;text-shadow:none}
.meter.hero{padding:var(--s5) var(--s3)}
.meter.hero .val{font-size:52px}

.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3)}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.stat .v{font-family:'Barlow Condensed';font-size:27px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);display:grid;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:#8b97a3;padding:11px 2px 13px;font-size:11px;border-radius:0;letter-spacing:.05em;font-family:'IBM Plex Sans',sans-serif;font-weight:500;text-transform:none}
nav button .ic{display:block;font-size:18px;line-height:1.3}
nav button.on{color:var(--amber);box-shadow:inset 0 3px 0 var(--amber)}

.row{display:flex;gap:var(--s2);align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.pill{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:100px;white-space:nowrap}
.pill.paid{background:rgba(14,124,82,.14);color:var(--ok)}
.pill.credit{background:rgba(193,53,43,.13);color:var(--due)}
.pill.warn{background:rgba(255,176,0,.2);color:var(--warn)}
.item{border-top:1px solid var(--line);padding:var(--s3) 0}
.item:first-of-type{border-top:0}
.muted{color:var(--muted);font-size:13px}
.hide{display:none!important}

.sheet{position:fixed;inset:0;background:rgba(8,11,14,.7);z-index:100;display:flex;align-items:flex-end}
.sheet>div{background:var(--concrete);width:100%;max-height:94vh;overflow:auto;padding:var(--s4);
  border-radius:14px 14px 0 0;max-width:640px;margin:0 auto;animation:rise .22s cubic-bezier(.2,.8,.3,1)}
.alertbar{background:rgba(255,176,0,.14);border:1px solid rgba(255,176,0,.5);border-left:4px solid var(--amber-d);
  padding:10px var(--s3);border-radius:var(--r);margin-bottom:var(--s2);font-size:14px;line-height:1.45}
.alertbar.bad{background:rgba(193,53,43,.1);border-color:rgba(193,53,43,.45);border-left-color:var(--due)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--panel);color:#fff;
  padding:12px 18px;border-radius:var(--r);z-index:200;font-weight:500;max-width:90%;font-size:15px;
  box-shadow:0 6px 24px rgba(0,0,0,.3)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.1em;font-weight:600}
.dayb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  border-radius:var(--r);font-weight:600;background:var(--paper);font-size:14px;font-variant-numeric:tabular-nums}
.dayb.P{background:rgba(14,124,82,.16);border-color:rgba(14,124,82,.4)}
.dayb.A{background:rgba(193,53,43,.13);border-color:rgba(193,53,43,.4)}
.dayb.H{background:rgba(255,176,0,.18);border-color:rgba(255,176,0,.45)}
.dayb.off{opacity:.3}

/* one orchestrated moment: the readout settles like an odometer coming to rest */
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@keyframes settle{from{transform:translateY(-0.22em);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:no-preference){
  .meter .val{animation:settle .34s cubic-bezier(.2,.9,.25,1) both}
  .card{animation:rise .18s ease-out}
}
</style>
</head>

S.settings={...DEF.settings,...S.settings};
function save(){
  try{localStorage.setItem(K,JSON.stringify(S))}

  const b=S.jobs.filter(j=>j.partyId===id).reduce((a,j)=>a+j.amount,0);

  if(j)return j.end;                    /* the latest job wins, even if corrected downward */

};

function shrink(dataUrl,max=1100,q=.7){return new Promise(r=>{const i=new Image();i.onload=()=>{
  const sc=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');
  c.width=i.width*sc;c.height=i.height*sc;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  r(c.toDataURL('image/jpeg',q))};i.src=dataUrl})}

/* The meter reads e.g. 258745 on the glass, which is 25874.5 hours.
   The operator types exactly what he sees; the app puts the decimal in. */
const meterLen=()=>+S.settings.meterDigits||6;
const toHours=raw=>S.settings.tenths?(+raw)/10:(+raw);
/* The meter reads a fixed number of digits — 25874.5 — so the readout shows the
   slots waiting to be filled rather than a number that grows from nothing. */
function showRaw(raw){
  const n=meterLen(),d=(raw||'').padEnd(n,'·').slice(0,n);
  return S.settings.tenths?d.slice(0,n-1)+'.'+d.slice(n-1):d;
}
/* A meter only runs forward, and never more than a long day between two photos. */
function plausible(v,last){
  if(v==null||isNaN(v)||v<=0)return false;
  if(last==null)return true;
  return v>=last-0.05&&v<=last+24;
}

/* photo, then a big keypad. Returns {reading, photoId}. */
async function captureReading(label,last){
  const shot=await shoot(); if(!shot)return null;
  const small=await shrink(shot);
  const pid='ph_'+uid(); await putPhoto(pid,small);
  return new Promise(res=>{
    let raw='';
    const pad=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
    openSheet(`<h2 class="disp">${label}</h2>
      <img src="${small}" style="width:100%;border-radius:4px;max-height:34vh;object-fit:cover">
      ${last!=null?`<p class="muted" style="margin:8px 0 0">${t('lastWas')} <b class="num">${last.toFixed(1)}</b> — ${t('mustHigher')}.</p>`:''}
      <div class="meter" style="margin:var(--s3) 0"><div class="lbl">${t('typeNumber')}</div>
        <div class="val num" id="kVal">– – – –</div>
        <div class="lbl" id="kHint" style="margin-top:4px">&nbsp;</div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${pad.map(k=>`<button class="btn ${k==='OK'?'':'ghost'}" data-k="${k}" style="width:100%;font-size:26px;min-height:64px">${k}</button>`).join('')}</div>
      <button class="btn ghost" id="kBack" style="margin-top:10px">${t('retakePhoto')}</button>`);
    const val=document.getElementById('kVal'),hint=document.getElementById('kHint');
    const paint=()=>{
      val.textContent=showRaw(raw);
      const v=toHours(raw);
      const full=raw.length===meterLen();
      if(!raw){hint.innerHTML='&nbsp;';return}
      if(!full){hint.style.color='#8b97a3';hint.textContent=(meterLen()-raw.length)+' more digit'+(meterLen()-raw.length>1?'s':'');return}
      if(last==null){hint.textContent=S.settings.tenths?'= '+v.toFixed(1)+' hours':'';return}
      const d=+(v-last).toFixed(1);
      hint.style.color=plausible(v,last)?'#9aa5ae':'#ff8a80';
      hint.textContent=d<0?t('belowLast'):d>24?t('over24'):d.toFixed(1)+' '+t('hoursThisJob');
    };
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='⌫')raw=raw.slice(0,-1);
      else if(k==='OK'){
        const v=toHours(raw);
        if(raw.length!==meterLen())return toast('Enter all '+meterLen()+' digits from the meter');
        if(!plausible(v,last))return toast(v<=(last||0)?'Must be higher than '+last.toFixed(1):'That is more than 24 hours — check it');
        closeSheet();return res({reading:v,photoId:pid});
      } else if(raw.length<meterLen())raw+=k;
      paint()});
    document.getElementById('kBack').onclick=async()=>{closeSheet();res(await captureReading(label,last))};
    paint();
  })}

function deviceId(){

  if(!d){d='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    localStorage.setItem('jcb_device',d)}
  return d;
}
const b64u={
  enc:o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/')))))
};
async function post(body){
  const r=await fetch(S.settings.script,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({...body,token:S.settings.token,device:deviceId()})});
  return r.json();
}
async function joinNow(name){
  try{
    const j=await post({action:'join',name:name||('Phone '+deviceId().slice(-4))});
    if(j.ok){S.settings.joined=j.status;S.settings.role=j.role||S.settings.role;save()}
    return j;
  }catch(e){return {ok:false,error:'no network'}}
}
/* An invite carries the sheet address and the password, so the second phone
   never has to be told anything. It still has to be approved by the owner. */
function inviteLink(){
  return location.origin+location.pathname+'#join='+b64u.enc({u:S.settings.script,t:S.settings.token,m:S.settings.machine});
}
async function handleInvite(){
  const m=location.hash.match(/join=([A-Za-z0-9\-_]+)/);
  if(!m)return false;
  let cfg;try{cfg=b64u.dec(m[1])}catch(e){return false}

/* ---------------- sync ---------------- */
function queue(type,row){S.queue.push({type,row,at:Date.now()});save();sync()}
let syncing=false;
async function sync(){
  const url=S.settings.script; const el=document.getElementById('hSync');
  if(!url){el.textContent='local only';return}
  if(syncing||!navigator.onLine||!S.queue.length){el.textContent=S.queue.length?S.queue.length+' to sync':'synced';return}
  syncing=true;el.textContent='syncing…';
  try{
    /* photos are large, so at most two ride along in any one request */
    const batch=[];let photos=0;
    for(const q of S.queue){
      if(q.type==='photo'){if(photos>=2)break;photos++}
      batch.push(q);
      if(batch.length>=20)break;
    }
    const payload=[];
    for(const q of batch){
      if(q.type==='photo'){
        const d=await getPhoto(q.row.id);
        if(!d)continue;                      /* image already gone — skip, do not block the queue */
        payload.push({type:'photo',row:{...q.row,data:d}});
      }else payload.push(q);
    }
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'sync',rows:payload,token:S.settings.token,device:deviceId()})});
    const j=await r.json();
    if(!j.ok&&j.code){S.lastErr=j.error||j.code;save();
      el.textContent=j.code==='PENDING'?'awaiting approval':'not authorised';syncing=false;return}
    if(j.ok){S.queue=S.queue.slice(batch.length);save();el.textContent=S.queue.length?S.queue.length+' to sync':'synced';
      if(S.queue.length){syncing=false;return sync()}
      await purgeOperatorData();}
    else{S.lastErr=j.error||'unknown';save();el.textContent='sync error'}
  }catch(e){S.lastErr='network: '+String(e&&e.message||e);save();el.textContent=S.queue.length+' waiting'}
  syncing=false;
}
/* Operator phones are a capture device, not a record. Once a job is safely in the
   sheet it is deleted from the phone — only the job on screen is kept, so the bill
   stays viewable. Photos go with it; Drive holds the copy that matters. */
async function purgeOperatorData(){
  if(!isOp())return;
  const pending=new Set(S.queue.map(q=>String(q.row&&(q.row.id||q.row.date))));
  const keep=S.jobs.slice().sort((a,b)=>b.ts-a.ts)[0];
  const keepIds=new Set([keep&&keep.id,S.active&&S.active.id].filter(Boolean));
  const gone=S.jobs.filter(j=>!keepIds.has(j.id)&&!pending.has(String(j.id)));
  if(!gone.length&&!S.payments.length&&!S.advances.length)return;
  const keepPhotos=new Set([keep&&keep.startPhoto,keep&&keep.endPhoto,
    S.active&&S.active.startPhoto].filter(Boolean));
  for(const j of gone){
    for(const pid of [j.startPhoto,j.endPhoto]){
      if(pid&&!keepPhotos.has(pid)&&!pending.has(String(pid))){
        try{await new Promise(r=>{idb.transaction('p','readwrite').objectStore('p').delete(pid).onsuccess=r})}catch(e){}
      }
    }
  }
  S.jobs=S.jobs.filter(j=>keepIds.has(j.id)||pending.has(String(j.id)));
  S.payments=S.payments.filter(x=>pending.has(String(x.id)));
  /* attendance and advances stay: they are his own record, shown read-only */
  save();
}

/* Pull what the other phone recorded. Anything still waiting in our own queue is
   left alone — an unsent local change must never be overwritten by an older copy. */
async function pullSheet(quiet){
  const url=S.settings.script;
  if(!url){if(!quiet)toast('Add the sheet URL in Setup first');return}
  const el=document.getElementById('hSync');if(el)el.textContent='loading…';
  try{
    const r=await fetch(url+'?action=pull&token='+encodeURIComponent(S.settings.token)+'&device='+encodeURIComponent(deviceId()));
    const j=await r.json();
    if(!j.ok){if(el)el.textContent=j.code==='PENDING'?'awaiting approval':'not authorised';
      if(!quiet)toast(j.error||'Not authorised');return}
    if(!j.data)throw 0;
    const D=j.data,pending=new Set(S.queue.map(q=>String(q.row&&(q.row.id||q.row.date))));
    let added=0;

    if(isOp()){
      /* parties and rates only — no ledger, no history, no other people's jobs */
      (D.parties||[]).forEach(p=>{
        if(!p.id)return;
        const ex=S.parties.find(x=>x.id===p.id);
        const row={id:p.id,name:p.name,phone:String(p.phone||''),rate:+p.rate||S.settings.rate};
        if(!ex){S.parties.push(row);added++}else Object.assign(ex,row);
      });
      (D.attendance||[]).forEach(r=>{
        const v=String(r.status||'');
        if(r.date&&v&&v!=='-')S.attendance[r.date]=v;else if(r.date)delete S.attendance[r.date];
      });
      S.advances=(D.advances||[]).map(r=>({id:String(r.id),date:String(r.date),who:r.who,amount:+r.amount,note:r.note||''}));
      let hi=-1;
      (D.jobs||[]).forEach(r=>{if(String(r.paid)!=='DELETED'&&+r.end>hi)hi=+r.end});
      const unsent=S.queue.some(q=>q.type==='job');
      if(hi>=0)S.settings.lastMeter=unsent?Math.max(hi,S.settings.lastMeter||-1):hi;
      /* drop any stale job kept on this phone; the sheet has the corrected copy */
      S.jobs=S.jobs.filter(j=>pending.has(String(j.id)));
      const keep=['machine','rate','minHours','transport','dieselRate','tenths','upi','upiName','owner'];
      (D.settings||[]).forEach(r=>{
        if(!keep.includes(r.key))return;
        S.settings[r.key]=r.key==='tenths'?(String(r.value)==='true'||r.value===true)
          :(typeof S.settings[r.key]==='number'?(+r.value||0):String(r.value));
      });
      save();render();
      if(!quiet)toast('Updated');
      return;
    }

    (D.parties||[]).forEach(p=>{
      if(!p.id||pending.has(String(p.id)))return;
      const ex=S.parties.find(x=>x.id===p.id);
      const row={id:p.id,name:p.name,phone:String(p.phone||''),rate:+p.rate||S.settings.rate};
      if(!ex){S.parties.push(row);added++}else Object.assign(ex,row);
    });
    const photo={};(D.photos||[]).forEach(x=>{if(x.id)photo[x.id]=x.driveUrl});

    (D.jobs||[]).forEach(r=>{
      if(!r.id||pending.has(String(r.id)))return;
      if(String(r.paid)==='DELETED'){const i=S.jobs.findIndex(x=>x.id===r.id);if(i>-1)S.jobs.splice(i,1);return}
      let pid=r.partyId;
      if(!pid){const m=S.parties.find(x=>x.name===r.party);pid=m?m.id:null;
        if(!pid&&r.party){pid=uid();S.parties.push({id:pid,name:r.party,phone:'',rate:+r.rate||S.settings.rate})}}
      const row={id:String(r.id),date:String(r.date),ts:Date.parse(r.date)||Date.now(),partyId:pid,
        site:r.site||'',start:+r.start,end:+r.end,hours:+r.hours,billHours:+r.billHours||+r.hours,
        rate:+r.rate,transport:+r.transport||0,amount:+r.amount,paid:String(r.paid)==='PAID',
        mode:r.mode||'',diesel:+r.diesel||0,startPhoto:r.startPhoto||'',endPhoto:r.endPhoto||'',
        startUrl:photo[r.startPhoto]||'',endUrl:photo[r.endPhoto]||'',
        editedAt:r.editedAt||'',editNote:r.editNote||''};
      const ex=S.jobs.find(x=>x.id===row.id);
      if(!ex){S.jobs.push(row);added++}
      else{
        /* the sheet is the record: if the figures differ and we have nothing
           unsent for this job, take the sheet's version — including hand edits */
        const differs=['start','end','hours','billHours','rate','transport','amount','date','partyId','paid']
          .some(k=>String(ex[k])!==String(row[k]));
        if(differs){Object.assign(ex,row);added++}
      }
    });

    /* iOS can clear a web app's storage, and each way of opening it keeps its own
       copy. So treat the sheet as the fallback: anything blank here gets refilled. */
    if(D.settings&&D.settings.length){
      const restorable=['machine','owner','rate','minHours','transport','dieselRate','tenths',
        'upi','upiName','opName','salary','workDays','otRate','serviceEvery','lastService'];
      D.settings.forEach(r=>{
        if(!restorable.includes(r.key))return;
        const cur=S.settings[r.key];
        const blank=cur===''||cur===null||cur===undefined||(typeof cur==='number'&&!cur);
        if(!blank)return;
        S.settings[r.key]=r.key==='tenths'?(String(r.value)==='true'||r.value===true)
          :(typeof DEF.settings[r.key]==='number'?(+r.value||0):String(r.value));
      });
    }

    /* A row deleted straight out of the sheet should disappear from the phones.
       Anything still unsent is kept — it has not reached the sheet yet. */
    const sheetJobs=new Set((D.jobs||[]).map(r=>String(r.id)));
    const dropped=S.jobs.filter(j=>!sheetJobs.has(String(j.id))&&!pending.has(String(j.id)));
    if(dropped.length){
      S.jobs=S.jobs.filter(j=>sheetJobs.has(String(j.id))||pending.has(String(j.id)));
      added+=dropped.length;
    }
    const sheetPays=new Set((D.payments||[]).map(r=>String(r.id)));
    S.payments=S.payments.filter(x=>sheetPays.has(String(x.id))||pending.has(String(x.id)));

    (D.payments||[]).forEach(r=>{
      if(!r.id||pending.has(String(r.id))||S.payments.find(x=>x.id===r.id))return;
      let pid=r.partyId;
      if(!pid){const m=S.parties.find(x=>x.name===r.party);pid=m?m.id:null}
      if(!pid)return;
      S.payments.push({id:String(r.id),partyId:pid,party:r.party,amount:+r.amount,
        date:String(r.date),mode:r.mode||'',jobId:r.jobId||''});added++;
    });

    (D.attendance||[]).forEach(r=>{
      if(!r.date||pending.has(String(r.date)))return;
      const v=String(r.status||'');
      if(v&&v!=='-'&&!S.attendance[r.date]){S.attendance[r.date]=v;added++}
    });

    if(S.settings.role==='operator'&&D.settings){
      const keep=['machine','rate','minHours','transport','dieselRate','tenths','upi','upiName','owner'];
      D.settings.forEach(r=>{
        if(!keep.includes(r.key))return;
        S.settings[r.key]=r.key==='tenths'?(String(r.value)==='true'||r.value===true)
          :(typeof S.settings[r.key]==='number'?(+r.value||0):String(r.value));
      });
    }
    (D.advances||[]).forEach(r=>{
      if(!r.id||S.advances.find(x=>x.id===r.id))return;
      S.advances.push({id:String(r.id),date:String(r.date),who:r.who,amount:+r.amount,note:r.note||''});added++;
    });

    if(S.active&&!sheetJobs.has(String(S.active.id))&&!pending.has(String(S.active.id))){
      /* the running job still lives only on the phone that started it — leave it alone */
    }
    save();render();
    if(!quiet)toast(added?'Updated — '+added+' change(s)':'Already up to date');
  }catch(e){if(!quiet)toast('Could not load from the sheet')}
}
async function pushPhoto(pid,meta){
  if(!S.settings.script)return;
  /* the image itself stays in IndexedDB — only a pointer goes in the queue,
     which lives in localStorage and would otherwise fill up and break saving */
  queue('photo',{id:pid,...meta});
}

/* ---------------- WhatsApp + UPI ---------------- */
function upiLink(amt,note){
  const s=S.settings;if(!s.upi)return '';
  return `upi://pay?pa=${encodeURIComponent(s.upi)}&pn=${encodeURIComponent(s.upiName||s.owner||'Owner')}&am=${amt}&cu=INR&tn=${encodeURIComponent(note)}`;
}
function billText(j){
  const p=party(j.partyId),s=S.settings;
  const L=[`*${s.machine} — Work Bill*`,
    `Date: ${fmtD(j.date)}`,
    `Party: ${p.name}`,
    j.site?`Site: ${j.site}`:'',
    `Start meter: ${j.start}`,
    `End meter: ${j.end}`,
    `Hours worked: ${j.hours.toFixed(1)} hr${j.billHours!==j.hours?` (billed ${j.billHours.toFixed(1)} hr min)`:''}`,
    `Rate: ${money(j.rate)}/hr`,
    j.transport?`Transport: ${money(j.transport)}`:'',
    `*Total: ${money(j.amount)}*`,
    j.paid?`Status: PAID (${j.mode})`:`Status: PENDING`];
  const due=partyDue(j.partyId);
  if(!j.paid&&due>j.amount)L.push(`Total outstanding: ${money(due)}`);
  if(!j.paid&&S.settings.upi)L.push('',`Pay by UPI: ${S.settings.upi}`);
  return L.filter(Boolean).join('\n');
}
function waSend(text,phone){
  const p=(phone||'').replace(/\D/g,'');
  const n=p.length===10?'91'+p:p;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(text)}`,'_blank');
}

   "what am I owed, and is the machine running". One screen each. */

function elapsed(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return m<60?m+' min':(Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m');
}

  const ym=today().slice(0,7),js=monthJobs(ym);
  const billed=js.reduce((x,j)=>x+j.amount,0);
  const got=S.payments.filter(p=>p.date.startsWith(ym)).reduce((x,p)=>x+p.amount,0);
  const hrs=js.reduce((x,j)=>x+j.hours,0);

  /* things that need a decision, gathered in one place instead of scattered */
  const flags=[];
  const svcNext=(+s.lastService||0)+(+s.serviceEvery||0);
  if(lr!=null&&svcNext-lr<=20)
    flags.push({bad:svcNext-lr<=0,txt:svcNext-lr<=0
      ?`Service overdue by ${Math.abs(svcNext-lr).toFixed(1)} hr.`
      :`Service due in ${(svcNext-lr).toFixed(1)} hr, at ${svcNext.toFixed(1)}.`});
  const old=due.filter(x=>{
    const last=S.jobs.filter(j=>j.partyId===x.p.id).sort((m,n)=>n.ts-m.ts)[0];
    return last&&(Date.now()-last.ts)>30*864e5});
  if(old.length)flags.push({bad:true,txt:`${old.map(x=>esc(x.p.name)).join(', ')} — nothing collected in over a month.`});

  let h=`<div class="card">
      <div class="meter hero"><div class="lbl">Outstanding</div>

  if(a){
    h+=`<div class="between" style="margin-top:var(--s3);padding:var(--s3);border:1px solid var(--line);border-radius:var(--r)">

  if(flags.length)h+=flags.map(f=>`<div class="alertbar ${f.bad?'bad':''}">${f.txt}</div>`).join('');

  h+=`<div class="card"><h2>This month</h2>
      <div class="grid3">
        <div class="stat"><div class="k">Billed</div><div class="v num">${money(billed)}</div></div>
        <div class="stat"><div class="k">Collected</div><div class="v num" style="color:var(--ok)">${money(got)}</div></div>
        <div class="stat"><div class="k">Hours</div><div class="v num">${hrs.toFixed(1)}</div></div></div></div>`;

  const recent=S.jobs.slice().sort((x,y)=>y.ts-x.ts).slice(0,4);
  h+=`<div class="card"><div class="between"><h2>Recent work</h2>
      <button class="btn ghost sm" id="expCsv">Export</button></div>`;
  h+=recent.length?recent.map(j=>`<div class="item between">
      <div><b>${esc(party(j.partyId).name)}</b> <span class="muted">${fmtD(j.date)}</span>
        <div class="muted mono" style="font-size:12px">${j.start.toFixed(1)} → ${j.end.toFixed(1)} · ${j.hours.toFixed(1)} hr</div></div>
      <div style="text-align:right"><div class="disp num" style="font-size:22px">${money(j.amount)}</div>
        <span class="pill ${j.paid?'paid':'credit'}">${j.paid?(j.mode||'paid'):'credit'}</span>
        <div><button class="btn ghost sm jShare" data-id="${j.id}" style="margin-top:var(--s1)">Open</button></div></div></div>`).join('')
    :`<p class="muted">No jobs yet. Add a party, then start a job — every job opens with a photo of the hour meter.</p>`;
  h+='</div>';
  app.innerHTML=h;
  bindWork();
  const pay=document.getElementById('hPay');
  if(pay)pay.onclick=()=>{
    if(!S.parties.length)return toast('Add a party first');
    openSheet(`<h2 class="disp">Record payment</h2><label>Party</label>
      <select id="qP">${S.parties.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(partyDue(p.id))}</option>`).join('')}</select>
      <div class="grid2" style="margin-top:var(--s3)"><button class="btn ghost" id="x">Cancel</button>
      <button class="btn" id="go">Continue</button></div>`);
    document.getElementById('x').onclick=closeSheet;

function bindWork(){
  const nb=document.getElementById('newJob');if(nb)nb.onclick=()=>{if(!S.active)startJob()};
  const eb=document.getElementById('endJob');if(eb)eb.onclick=endJob;
  const cb=document.getElementById('cancelJob');if(cb)cb.onclick=()=>{
    if(confirm('Discard this running job?')){S.active=null;save();render()}};
  const ex=document.getElementById('expCsv');if(ex)ex.onclick=exportCsv;
  document.querySelectorAll('.jShare').forEach(b=>b.onclick=()=>shareJob(b.dataset.id));

async function startJob(){
  if(!S.parties.length){toast(isOp()?t('noParty'):'Add a party first (Parties tab)');if(!isOp()){tab='ledger';render()}return}
  const lr=lastReading();
  const r=await captureReading(t('startWork'),lr);if(!r)return;
  let warn='';
  if(lr!=null&&r.reading<lr-0.05)warn=`<div class="alertbar bad">This reading (${r.reading}) is lower than the last recorded end (${lr}). Check the photo — an hour meter never runs backwards.</div>`;
  else if(lr!=null&&r.reading>lr+0.2)warn=`<div class="alertbar">Meter moved <b>${(r.reading-lr).toFixed(1)} hr</b> since the last job ended (${lr}). That time is not billed to anyone — confirm with the operator.</div>`;
  openSheet(`<h2 class="disp">Start job</h2>${warn}
    <label>${t('party')}</label><select id="jParty">${S.parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <label>${t('site')}</label><input id="jSite" placeholder="e.g. Hosur road plot, foundation digging">
    <label>${t('ratePerHr')}</label><input id="jRate" type="number" inputmode="numeric" value="${S.parties[0].rate||S.settings.rate}">
    <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="x">${t('cancel')}</button><button class="btn" id="go">${t('startJob')}</button></div>`);
  document.getElementById('jParty').onchange=e=>{document.getElementById('jRate').value=party(e.target.value).rate||S.settings.rate};
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('go').onclick=async()=>{
    const g=await geo();
    S.active={id:uid(),partyId:document.getElementById('jParty').value,site:document.getElementById('jSite').value,
      rate:+document.getElementById('jRate').value,start:r.reading,startPhoto:r.photoId,startTs:Date.now(),date:today(),loc:g};
    save();pushPhoto(r.photoId,{kind:'start',jobId:S.active.id,at:new Date().toISOString(),loc:g});
    closeSheet();render();toast(t('jobStarted'))};
}

async function endJob(){
  const a=S.active,r=await captureReading(t('endWork'),a.start);if(!r)return;
  if(r.reading<a.start){toast('End reading is below start reading — retake');return endJob()}
  const hours=+(r.reading-a.start).toFixed(1);
  const s=S.settings,bill=Math.max(hours,+s.minHours||0);
  openSheet(`<h2 class="disp">${t('closeJob')}</h2>
    <div class="grid2" style="margin:10px 0">
      <div class="meter plain"><div class="lbl">${t('start')}</div><div class="val num small">${a.start.toFixed(1)}</div></div>
      <div class="meter plain"><div class="lbl">${t('end')}</div><div class="val num small">${r.reading.toFixed(1)}</div></div></div>
    <div class="meter"><div class="lbl">${t('hoursWorked')}</div><div class="val num">${hours.toFixed(1)}</div></div>
    <div class="grid2"><div><label>${t('ratePerHr')}</label><input id="eRate" type="number" value="${a.rate}"></div>
      <div><label>${t('billedHours')} (min ${s.minHours})</label><input id="eHrs" type="number" step="0.1" value="${bill.toFixed(1)}"></div></div>
    <div class="grid2"><div><label>${t('transport')}</label><input id="eTr" type="number" value="${s.transport||0}"></div>
      <div><label>${t('diesel')}</label><input id="eDz" type="number" step="0.1" placeholder="optional"></div></div>
    <div class="meter" style="margin:12px 0"><div class="lbl">${t('amountPayable')}</div><div class="val num" id="eAmt">—</div></div>
    <label>${t('payment')}</label>
    <div class="grid3"><button class="btn ghost sm pm" data-m="credit">${t('credit')}</button><button class="btn ghost sm pm" data-m="cash">${t('cash')}</button><button class="btn ghost sm pm" data-m="upi">${t('upi')}</button></div>
    <div class="grid2" style="margin-top:14px"><button class="btn ghost" id="x">${t('back')}</button><button class="btn" id="go">${t('saveJob')}</button></div>`);
  let mode='credit';
  const calc=()=>{const v=(+document.getElementById('eHrs').value||0)*(+document.getElementById('eRate').value||0)+(+document.getElementById('eTr').value||0);
    document.getElementById('eAmt').textContent=money(v);return Math.round(v)};
  ['eRate','eHrs','eTr'].forEach(i=>document.getElementById(i).oninput=calc);calc();
  document.querySelectorAll('.pm').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
    document.querySelectorAll('.pm').forEach(x=>{x.className='btn ghost sm pm'});b.className='btn sm pm'});
  document.querySelector('.pm').click();
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('go').onclick=async()=>{
    const amt=calc(),dz=+document.getElementById('eDz').value||0;
    const j={id:a.id,date:a.date,ts:Date.now(),partyId:a.partyId,site:a.site,start:a.start,end:r.reading,
      hours,billHours:+document.getElementById('eHrs').value,rate:+document.getElementById('eRate').value,
      transport:+document.getElementById('eTr').value||0,amount:amt,paid:mode!=='credit',mode:mode==='credit'?'':mode,
      diesel:dz,startPhoto:a.startPhoto,endPhoto:r.photoId,loc:a.loc};
    S.jobs.push(j);
    S.settings.lastMeter=r.reading;
    if(j.paid)addPayment({id:uid(),partyId:j.partyId,party:party(j.partyId).name,amount:amt,date:j.date,mode:j.mode,jobId:j.id});
    if(dz)S.diesel.push({id:uid(),date:j.date,litres:dz,amount:Math.round(dz*S.settings.dieselRate),jobId:j.id});
    if(S.attendance[j.date]===undefined)S.attendance[j.date]='P';
    S.active=null;save();
    queue('job',{...j,party:party(j.partyId).name});
    pushPhoto(r.photoId,{kind:'end',jobId:j.id,at:new Date().toISOString()});
    closeSheet();render();shareJob(j.id);
  };
}

function shareJob(id){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;const p=party(j.partyId);
  const txt=billText(j),link=upiLink(j.amount,`${S.settings.machine} ${fmtD(j.date)}`);

/* Owner-side correction. Readings and money are evidence, so every change is
   logged on the job and pushed to the sheet rather than silently overwritten. */
function editJob(id){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  openSheet(`<h2 class="disp">Correct job</h2>
    <p class="muted">${fmtD(j.date)} · originally ${j.start.toFixed(1)} → ${j.end.toFixed(1)}. The meter photos stay untouched as proof.</p>
    <label>Party</label><select id="eP">${S.parties.map(p=>`<option value="${p.id}" ${p.id===j.partyId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label>Site / detail</label><input id="eS" value="${esc(j.site||'')}">
    <div class="grid2"><div><label>Start reading</label><input id="eA" type="number" step="0.1" value="${j.start}"></div>
      <div><label>End reading</label><input id="eB" type="number" step="0.1" value="${j.end}"></div></div>
    <div class="grid2"><div><label>Billed hours</label><input id="eH" type="number" step="0.1" value="${j.billHours}"></div>
      <div><label>Rate / hour</label><input id="eR" type="number" value="${j.rate}"></div></div>
    <div class="grid2"><div><label>Transport</label><input id="eT" type="number" value="${j.transport||0}"></div>
      <div><label>Date</label><input id="eD" type="date" value="${j.date}"></div></div>
    <div class="meter" style="margin:12px 0"><div class="lbl">Amount</div><div class="val num" id="eAmt">—</div>
      <div class="lbl" id="eDelta" style="margin-top:4px">&nbsp;</div></div>
    <div class="grid2"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="go">Save correction</button></div>
    <button class="btn danger" id="del" style="width:100%;margin-top:14px">Delete this job</button>`);
  const calc=()=>{
    const v=Math.round((+document.getElementById('eH').value||0)*(+document.getElementById('eR').value||0)+(+document.getElementById('eT').value||0));
    document.getElementById('eAmt').textContent=money(v);
    const d=v-j.amount,el=document.getElementById('eDelta');
    el.innerHTML=d?`was ${money(j.amount)} — ${d>0?'up':'down'} ${money(Math.abs(d))}`:'&nbsp;';
    return v};
  ['eH','eR','eT'].forEach(i=>document.getElementById(i).oninput=calc);
  document.getElementById('eA').oninput=document.getElementById('eB').oninput=()=>{
    const a=+document.getElementById('eA').value,b=+document.getElementById('eB').value;
    if(b>a){document.getElementById('eH').value=(b-a).toFixed(1);calc()}};
  calc();
  document.getElementById('x').onclick=()=>shareJob(id);
  document.getElementById('del').onclick=()=>{
    if(!confirm('Delete this job permanently? The party balance will change by '+money(j.amount)+'.'))return;
    dropPaymentFor(j.id);
    queue('job',{...j,party:party(j.partyId).name,deleted:true});
    S.jobs.splice(S.jobs.indexOf(j),1);save();closeSheet();render();toast('Job deleted')};
  document.getElementById('go').onclick=()=>{
    const a=+document.getElementById('eA').value,b=+document.getElementById('eB').value;
    if(!(b>a))return toast('End reading must be above start');
    const before={start:j.start,end:j.end,hours:j.hours,rate:j.rate,amount:j.amount,party:party(j.partyId).name};
    const amt=calc();
    j.partyId=document.getElementById('eP').value;
    j.site=document.getElementById('eS').value;
    j.date=document.getElementById('eD').value;
    j.start=a;j.end=b;j.hours=+(b-a).toFixed(1);
    j.billHours=+document.getElementById('eH').value;
    j.rate=+document.getElementById('eR').value;
    j.transport=+document.getElementById('eT').value||0;
    j.amount=amt;
    const ch=[];
    if(before.start!==a||before.end!==b)ch.push(`meter ${before.start}→${before.end} became ${a}→${b}`);
    if(before.rate!==j.rate)ch.push(`rate ${before.rate}→${j.rate}`);
    if(before.amount!==amt)ch.push(`amount ${before.amount}→${amt}`);
    if(before.party!==party(j.partyId).name)ch.push(`party ${before.party}→${party(j.partyId).name}`);
    j.editedAt=new Date().toISOString();
    j.editNote=[j.editNote,ch.join('; ')].filter(Boolean).join(' | ').slice(-450);
    /* a job paid at the site has its own payment row — keep it equal to the new amount */
    const lp=S.payments.find(x=>x.jobId===j.id);
    if(lp&&lp.amount!==amt){lp.amount=amt;lp.partyId=j.partyId;lp.party=party(j.partyId).name;queue('payment',lp)}
    save();queue('job',{...j,party:party(j.partyId).name});closeSheet();render();toast('Corrected')};
}

/* Indian numbers arrive from the phonebook as +91 98765 43210, 098765 43210,
   or with dashes. Store the bare 10 digits so WhatsApp links always work. */
function tidyPhone(t){
  let d=String(t||'').replace(/\D/g,'');
  if(d.length>10)d=d.slice(-10);
  return d;
}
function contactSupport(){
  if(!('contacts' in navigator))return 'no navigator.contacts';
  if(!('ContactsManager' in window))return 'no ContactsManager';
  if(!navigator.contacts.select)return 'no select()';
  if(!window.isSecureContext)return 'not a secure page';
  return '';
}
const canPickContact=()=>contactSupport()==='';
async function pickContact(){
  try{
    const list=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(!list||!list.length)return null;
    const c=list[0];
    return {name:(c.name&&c.name[0])||'',phone:tidyPhone(c.tel&&c.tel[0])};
  }catch(e){return null}
}
function editParty(id){
  const p=id?party(id):{name:'',phone:'',rate:S.settings.rate};
  openSheet(`<h2 class="disp">${id?'Edit':'New'} party</h2>
    ${canPickContact()?'<button class="btn dark" id="pPick" style="margin-bottom:4px">Choose from contacts</button>':''}
    <label>Name</label><input id="pN" value="${esc(p.name)}">
    <label>WhatsApp number</label><input id="pP" type="tel" inputmode="numeric" value="${esc(p.phone||'')}" placeholder="10 digits">
    <label>Rate per hour</label><input id="pR" type="number" value="${p.rate||S.settings.rate}">
    <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="go">Save</button></div>`);
  const pk=document.getElementById('pPick');
  if(pk)pk.onclick=async()=>{
    const why=contactSupport();
    if(why){toast('Contact picker unavailable — '+why);return}
    const c=await pickContact();
    if(!c)return toast('No contact chosen');
    /* never wipe something already typed with a blank field from the phonebook */
    if(c.name)document.getElementById('pN').value=c.name;
    if(c.phone)document.getElementById('pP').value=c.phone;
    if(!c.phone)toast('That contact has no number saved');
  };
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('go').onclick=()=>{
    const n=document.getElementById('pN').value.trim();if(!n)return toast('Name required');
    const ph=tidyPhone(document.getElementById('pP').value);
    if(ph&&ph.length!==10)return toast('Number should be 10 digits');
    const dup=S.parties.find(x=>x.id!==id&&ph&&tidyPhone(x.phone)===ph);
    if(dup)return toast('That number is already saved as '+dup.name);
    const row={id:id||uid(),name:n,phone:ph,rate:+document.getElementById('pR').value};
    if(id)Object.assign(party(id),row);else S.parties.push(row);
    save();queue('party',row);closeSheet();render()};
}
function openParty(id){
  const p=party(id),due=partyDue(id);
  const rows=[...S.jobs.filter(j=>j.partyId===id).map(j=>({d:j.date,t:`Work ${j.hours.toFixed(1)} hr`,dr:j.amount,cr:0})),
              ...S.payments.filter(x=>x.partyId===id).map(x=>({d:x.date,t:'Payment '+(x.mode||''),dr:0,cr:x.amount}))]
              .sort((a,b)=>a.d<b.d?1:-1);
  openSheet(`<h2 class="disp">${esc(p.name)}</h2>
    <div class="meter" style="margin:10px 0"><div class="lbl">Balance to collect</div><div class="val num">${money(due)}</div></div>

    ${rows.map(r=>`<tr><td class="num">${fmtD(r.d)}</td><td>${esc(r.t)}</td><td class="num" style="text-align:right">${r.dr?money(r.dr):''}</td><td class="num" style="text-align:right;color:var(--ok)">${r.cr?money(r.cr):''}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No entries.</td></tr>'}</table>
    <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="pEdit">Edit party</button><button class="btn ghost" id="x">Close</button></div>`);
  document.getElementById('x').onclick=closeSheet;
  document.getElementById('pEdit').onclick=()=>editParty(id);
  document.getElementById('pRemind').onclick=()=>{
    const t=`Namaste ${p.name},\n\nGentle reminder — ${money(due)} is pending for ${S.settings.machine} work.\n${S.settings.upi?`\nUPI: ${S.settings.upi}`:''}\n\n- ${S.settings.owner||''}`;
    waSend(t,p.phone)};
  document.getElementById('pPay').onclick=()=>{
    openSheet(`<h2 class="disp">Payment from ${esc(p.name)}</h2>
      <label>Amount received</label><input id="yA" type="number" inputmode="numeric" value="${Math.max(0,due)}" style="font-size:26px;font-weight:700;text-align:center">
      <label>Date</label><input id="yD" type="date" value="${today()}">
      <label>Mode</label><select id="yM"><option>upi</option><option>cash</option><option>bank</option><option>cheque</option></select>
      <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="go">Save payment</button></div>`);
    document.getElementById('x').onclick=()=>openParty(id);
    document.getElementById('go').onclick=()=>{
      const row={id:uid(),partyId:id,party:p.name,amount:+document.getElementById('yA').value,
        date:document.getElementById('yD').value,mode:document.getElementById('yM').value};
      if(!row.amount)return toast('Enter amount');
      addPayment(row);save();
      /* mark the oldest credit jobs as settled, oldest first */
      let left=row.amount;
      S.jobs.filter(j=>j.partyId===id&&!j.paid).sort((a,b)=>a.ts-b.ts).forEach(j=>{
        if(left>=j.amount){j.paid=true;j.mode=row.mode;left-=j.amount;queue('job',{...j,party:p.name})}});
      save();closeSheet();render();toast('Payment recorded')}};
}

  const cnt={P:0,A:0,H:0};

      <div class="stat"><div class="k">Avg / hour</div><div class="v num">${money(hrs?rev/hrs:0)}</div></div></div></div>
    <div class="card"><h2>Rough profit</h2>
      <table><tr><td>Billing</td><td class="num" style="text-align:right">${money(rev)}</td></tr>
      <tr><td>Diesel logged</td><td class="num" style="text-align:right">− ${money(dz)}</td></tr>
      <tr><td>Operator salary</td><td class="num" style="text-align:right">− ${money(s.salary)}</td></tr></table>
      <div class="meter" style="margin-top:10px"><div class="lbl">Before EMI, service &amp; repairs</div><div class="val num">${money(profit)}</div></div></div>
    <div class="card"><h2>Top parties this month</h2>
      ${top.length?top.map(([id,v])=>`<div class="item between"><span>${esc(party(id).name)}</span><b class="mono">${money(v)}</b></div>`).join(''):'<p class="muted">Nothing billed this month yet.</p>'}</div>`;
}

/* --- SETTINGS --- */
function vSet(){
  const s=S.settings;
  const F=(k,l,t='text',extra='')=>`<label>${l}</label><input id="s_${k}" type="${t}" value="${esc(s[k])}" ${extra}>`;
  const langSel=`<label>${t('language')}</label><select id="s_lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`;

  if(isOp()){
    app.innerHTML=`<div class="card"><h2>${t('setup')}</h2>
      ${langSel}
      <p class="muted" style="margin-top:12px">${t('machine')}: <b>${esc(s.machine)}</b><br>${t('thisDevice')}: <b>${s.joined==='approved'?t('connected'):t('awaiting')}</b></p>
      <button class="btn ghost" id="sPull" style="margin-top:10px">${t('save')} / ${t('close')}</button></div>
      <div class="card"><p class="muted">App version ${BUILD}</p></div>`;
    document.getElementById('s_lang').value=s.lang||'en';
    document.getElementById('s_lang').onchange=e=>{s.lang=e.target.value;save();render()};
    document.getElementById('sPull').onclick=()=>pullSheet(false);
    return;
  }
  app.innerHTML=`<div class="card"><h2>Owner &amp; machine</h2>
    ${langSel}
    ${F('owner','Owner name')}${F('machine','Machine')}
    <div class="grid2"><div>${F('rate','Default rate / hr','number')}</div><div>${F('minHours','Minimum billed hours','number','step="0.5"')}</div></div>
    <div class="grid2"><div>${F('transport','Default transport charge','number')}</div><div>${F('dieselRate','Diesel ₹ / litre','number')}</div></div></div>
  <div class="card"><h2>Payment</h2>${F('upi','Your UPI ID','text','placeholder="name@bank"')}${F('upiName','Name shown on UPI')}</div>
  <div class="card"><h2>Operator</h2>${F('opName','Operator name')}
    <div class="grid2"><div>${F('salary','Monthly salary','number')}</div><div>${F('workDays','Working days / month','number')}</div></div>
    ${F('otRate','Overtime ₹ / hr beyond 8 hr','number')}</div>
  <div class="card"><h2>Meter format</h2>
    <p class="muted">Your meter shows 6 digits like <b>258745</b>. If the last digit is tenths of an hour, that is 25874.5 hours — leave this on. Getting it wrong changes every bill by 10x.</p>
    <label>Digits on the meter</label><input id="s_meterDigits" type="number" value="${s.meterDigits}">
    <label>Last digit</label>
    <select id="s_tenths"><option value="1"${s.settings&&s.settings.tenths?'':''}>Tenths of an hour (258745 = 25874.5)</option><option value="0">Whole hours (258745 = 258745)</option></select></div>
  <div class="card"><h2>Service</h2>
    <div class="grid2"><div>${F('serviceEvery','Service every (hours)','number')}</div><div>${F('lastService','Meter at last service','number','step="0.1"')}</div></div></div>
  <div class="card"><h2>This device</h2>
    <p class="muted">Status: <b>${s.joined==='approved'?'connected as '+esc(s.role):s.joined==='pending'?'waiting for owner approval':'not paired yet'}</b></p>
    <label>Role</label><select id="s_role"><option value="owner">Owner — bills, ledger, salary</option><option value="operator">Operator — records jobs on site</option></select>
    <div class="grid2" style="margin-top:10px"><button class="btn dark" id="sPull">Load from sheet</button><button class="btn ghost" id="sJoin">Pair this phone</button></div></div>
  <div class="card" id="teamCard"><div class="between"><h2>Team</h2><button class="btn sm" id="tInvite">Invite a phone</button></div>
    <p class="muted">Phones that have asked to join. Nothing syncs until you approve it.</p>
    <div id="teamList"><p class="muted">Tap refresh to load.</p></div>
    <button class="btn ghost sm" id="tRef" style="width:100%;margin-top:8px">Refresh list</button></div>
  <div class="card"><h2>Google Sheet backup</h2>
    <p class="muted">Paste the Apps Script web app URL from SETUP. Everything works without it — this only copies data to your Sheet and photos to Drive.</p>
    ${F('script','Web app URL','url')}
    ${F('token','Password (same as ACCESS_TOKEN in the script)','text')}
    <div class="grid2" style="margin-top:10px"><button class="btn ghost" id="sTest">Test link</button><button class="btn ghost" id="sPush">Sync now (${S.queue.length})</button></div></div>
  <div class="card"><h2>Data</h2>
    <p class="muted">App version <b>${BUILD}</b></p>
    <button class="btn ghost sm" id="dSelf" style="width:100%;margin-bottom:var(--s2)">Save my setup link</button>
    <button class="btn ghost sm" id="dDiag" style="width:100%;margin-bottom:8px">Device check</button>
    <div class="grid2"><button class="btn ghost" id="dExp">Backup file</button><button class="btn ghost" id="dImp">Restore file</button></div>
    <button class="btn ghost" id="dReload" style="width:100%;margin-top:var(--s2)">Rebuild from sheet</button>
    <button class="btn ghost" id="dSet" style="width:100%;margin-top:var(--s2)">Restore settings from sheet</button>
    <button class="btn danger" id="dClearQ" style="width:100%;margin-top:var(--s2)">Clear stuck outbox (${S.queue.length})</button>
    <p class="muted">Only if the phone says storage is full and nothing will sync. Discards items waiting to be sent — jobs already in the sheet are unaffected.</p>
    <p class="muted">Clears the jobs, payments and balances held on this phone and loads them again from the sheet. Use it after editing the sheet by hand. Anything not yet synced is kept.</p>
    <button class="btn" id="sSave" style="margin-top:12px">Save settings</button></div>`;
  document.getElementById('s_tenths').value=s.tenths?'1':'0';
  document.getElementById('s_role').value=s.role||'owner';
  document.getElementById('s_lang').value=s.lang||'en';
  document.getElementById('s_lang').onchange=e=>{s.lang=e.target.value;save();render()};
  document.getElementById('sPull').onclick=()=>pullSheet(false);
  document.getElementById('sJoin').onclick=async()=>{
    if(!s.script||!s.token)return toast('Add the sheet URL and password first');
    const j=await joinNow(s.owner||s.opName||'Owner phone');
    toast(j.ok?(j.status==='approved'?'This phone is connected':'Sent — approve it from the owner phone'):(j.error||'Failed'));
    render()};
  document.getElementById('tInvite').onclick=()=>{
    if(!s.script||!s.token)return toast('Add the sheet URL and password first');
    const link=inviteLink();
    openSheet(`<h2 class="disp">Invite a phone</h2>
      <p class="muted">Send this to your operator. Opening it sets up his app completely — he only types his name. You then approve him below.</p>
      <textarea rows="4" id="ivT" style="font-size:12px">${esc(link)}</textarea>
      <button class="btn" id="ivWa" style="margin-top:10px">Send on WhatsApp</button>
      <button class="btn ghost" id="ivC" style="margin-top:8px">Copy link</button>
      <button class="btn ghost" id="x" style="margin-top:8px">Close</button>`);
    document.getElementById('ivWa').onclick=()=>waSend('Install our machine app from this link, then tell me when done:\n\n'+link,'');
    document.getElementById('ivC').onclick=()=>{navigator.clipboard.writeText(link);toast('Copied')};
    document.getElementById('x').onclick=closeSheet};
  document.getElementById('tRef').onclick=loadTeam;
  if(s.role==='owner'&&s.script&&s.token)loadTeam();
  document.getElementById('sSave').onclick=()=>{
    Object.keys(s).forEach(k=>{const el=document.getElementById('s_'+k);if(!el)return;
      if(k==='tenths'){s.tenths=el.value==='1';return}
      s[k]=el.type==='number'?(+el.value||0):el.value.trim()});
    save();queue('settings',{...s});toast('Saved');render()};
  document.getElementById('sTest').onclick=async()=>{
    const u=document.getElementById('s_script').value.trim();if(!u)return toast('Paste the URL first');
    try{const r=await fetch(u);const j=await r.json();toast(j.ok?'Connected to '+j.sheet:'Reached, but error')}catch(e){toast('Could not reach the script')}};
  document.getElementById('sPush').onclick=sync;
  document.getElementById('dSelf').onclick=()=>{
    if(!s.script||!s.token)return toast('Add the sheet address and password first');
    const link=inviteLink();
    openSheet(`<h2 class="disp">Your setup link</h2>
      <p class="muted">Send this to yourself on WhatsApp and keep it. If this phone ever loses its data, opening the link puts the address and password back in one tap.</p>
      <textarea rows="4">${esc(link)}</textarea>
      <button class="btn" id="slWa" style="margin-top:var(--s3)">Send to myself</button>
      <button class="btn ghost" id="x" style="margin-top:var(--s2)">Close</button>`);
    document.getElementById('slWa').onclick=()=>waSend('Machine Log setup link — keep this:\n\n'+link,'');
    document.getElementById('x').onclick=closeSheet};
  document.getElementById('dDiag').onclick=()=>{
    const why=contactSupport();
    openSheet(`<h2 class="disp">Device check</h2>
      <table>
        <tr><td>Contact picker</td><td style="text-align:right">${why?'<b style="color:var(--due)">'+esc(why)+'</b>':'<b style="color:var(--ok)">available</b>'}</td></tr>
        <tr><td>Camera capture</td><td style="text-align:right">${'capture' in document.createElement('input')?'yes':'no'}</td></tr>
        <tr><td>Location</td><td style="text-align:right">${navigator.geolocation?'yes':'no'}</td></tr>
        <tr><td>Secure page</td><td style="text-align:right">${window.isSecureContext?'yes':'no'}</td></tr>
        <tr><td>Installed app mode</td><td style="text-align:right">${matchMedia('(display-mode: standalone)').matches?'yes':'browser tab'}</td></tr>
      </table>
      <label>Browser</label><textarea rows="4" readonly style="font-size:12px">${esc(navigator.userAgent)}</textarea>
      <button class="btn ghost" id="x" style="margin-top:10px">Close</button>`);
    document.getElementById('x').onclick=closeSheet};
  document.getElementById('dClearQ').onclick=()=>{
    if(!confirm('Discard '+S.queue.length+' item(s) waiting to be sent? Anything not yet in the sheet is lost.'))return;
    S.queue=[];S.lastErr='';save();toast('Outbox cleared');render()};
  document.getElementById('dSet').onclick=async()=>{
    if(!S.settings.script)return toast('No sheet address on this phone');
    const restorable=['machine','owner','rate','minHours','transport','dieselRate','tenths',
      'upi','upiName','opName','salary','workDays','otRate','serviceEvery','lastService'];
    restorable.forEach(k=>{S.settings[k]=DEF.settings[k]});
    save();await pullSheet(true);toast('Settings restored');render()};
  document.getElementById('dReload').onclick=async()=>{
    if(!confirm('Clear the records on this phone and load them again from the sheet?'))return;
    const pending=new Set(S.queue.map(q=>String(q.row&&(q.row.id||q.row.date))));
    S.jobs=S.jobs.filter(j=>pending.has(String(j.id)));
    S.payments=S.payments.filter(x=>pending.has(String(x.id)));
    S.settings.lastMeter=null;save();
    await pullSheet(false);toast('Rebuilt from sheet')};
  document.getElementById('dExp').onclick=()=>{
    const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`machinelog-backup-${today()}.json`;a.click()};
  document.getElementById('dImp').onclick=()=>{
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=()=>{const f=new FileReader();f.onload=()=>{try{S=JSON.parse(f.result);save();toast('Restored');render()}catch(e){toast('Bad file')}};f.readAsText(i.files[0])};i.click()};
}

async function loadTeam(){
  const box=document.getElementById('teamList');if(!box)return;
  box.innerHTML='<p class="muted">Loading…</p>';
  try{
    const r=await fetch(S.settings.script+'?action=devices&token='+encodeURIComponent(S.settings.token)+'&device='+encodeURIComponent(deviceId()));
    const j=await r.json();
    if(!j.ok){box.innerHTML='<p class="muted">'+esc(j.error||'Could not load')+'</p>';return}
    box.innerHTML=(j.devices||[]).map(d=>{
      const me=String(d.deviceId)===deviceId();
      return `<div class="item between"><div><b>${esc(d.name)}</b>${me?' <span class="pill warn">this phone</span>':''}
        <div class="muted">${esc(d.role)} · ${esc(d.status)}</div></div>
        <div>${me?'':`<button class="btn ${d.status==='approved'?'ghost':''} sm tSet" data-id="${esc(d.deviceId)}" data-s="${d.status==='approved'?'blocked':'approved'}">${d.status==='approved'?'Block':'Approve'}</button>`}</div></div>`;
    }).join('')||'<p class="muted">No other phones yet.</p>';
    document.querySelectorAll('.tSet').forEach(b=>b.onclick=async()=>{
      b.textContent='…';
      const res=await post({action:'setDevice',target:b.dataset.id,status:b.dataset.s});
      toast(res.ok?'Updated':(res.error||'Failed'));loadTeam()});
  }catch(e){box.innerHTML='<p class="muted">Could not reach the sheet.</p>'}
}

function exportCsv(){
  const rows=[['Date','Party','Site','Start','End','Hours','Billed hrs','Rate','Transport','Amount','Status','Mode','Diesel L']];
  S.jobs.slice().sort((a,b)=>a.ts-b.ts).forEach(j=>rows.push([j.date,party(j.partyId).name,j.site||'',j.start,j.end,j.hours,j.billHours,j.rate,j.transport,j.amount,j.paid?'Paid':'Credit',j.mode||'',j.diesel||'']));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`work-${today()}.csv`;a.click();
}

/* boot */
document.getElementById('hSync').onclick=showSyncState;
openDB().then(async()=>{
  document.getElementById('hTitle').textContent=S.settings.machine||'Machine Log';
  await handleInvite();
  render();
  if(S.settings.role==='owner'&&S.settings.script&&navigator.onLine)setTimeout(()=>pullSheet(true),800);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
